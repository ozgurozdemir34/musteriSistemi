<div class="dialog-wrapper">

  <!-- HEADER -->
  <div class="dialog-header">
    <div class="dialog-header-left">
      <div class="logo-mark">M</div>
      <div>
        <h2 class="dialog-title">İletişim Ekle</h2>
        <p class="dialog-sub">{{ data.musteriAd }}</p>
      </div>
    </div>
    <button mat-icon-button class="kapat-btn" (click)="dialogRef.close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- CONTENT -->
  <mat-dialog-content class="dialog-content">
    <form [formGroup]="iletisimForm">

      <div class="section-title">
        <mat-icon>list_alt</mat-icon> Alanlar
      </div>

      <ng-container *ngFor="let d of dropdownlar">
        <mat-form-field appearance="outline" class="ff-full">
          <mat-label>{{ d.ad }}</mat-label>
          <mat-select [formControlName]="d.key">
            <mat-option *ngFor="let s of d.secenekler" [value]="s.ad">{{ s.ad }}</mat-option>
          </mat-select>
        </mat-form-field>
      </ng-container>

      <div class="section-title">
        <mat-icon>notes</mat-icon> Not
      </div>

      <mat-form-field appearance="outline" class="ff-full">
        <mat-label>Not</mat-label>
        <textarea matInput rows="3" formControlName="not"></textarea>
      </mat-form-field>

      <div class="section-title">
        <mat-icon>image</mat-icon> Görsel (İsteğe Bağlı)
      </div>

      <div class="dosya-alan">
        <input #dosyaInput type="file" accept=".jpg,.jpeg,.png"
               style="display:none"
               (change)="dosyaSecildi($event)">

        <button mat-stroked-button type="button" class="gorsel-sec-btn"
                (click)="dosyaInput.click()">
          <mat-icon>upload</mat-icon> Görsel Seç
        </button>

        <span *ngIf="secilenDosya" class="dosya-adi">
          <mat-icon style="font-size:16px; vertical-align:middle;">check_circle</mat-icon>
          {{ secilenDosya.name }}
        </span>

        <span *ngIf="!secilenDosya" class="dosya-ipucu">
          jpg veya png, max 5MB
        </span>
      </div>

    </form>
  </mat-dialog-content>

  <!-- FOOTER -->
  <div class="dialog-footer">
    <button mat-stroked-button class="iptal-btn" (click)="dialogRef.close()">
      İptal
    </button>
    <button mat-flat-button class="kaydet-btn"
            [disabled]="!iletisimForm || iletisimForm.invalid || dosyaYukleniyor"
            (click)="kaydet()">
      <mat-spinner *ngIf="dosyaYukleniyor" diameter="18" style="display:inline-block; margin-right:6px;"></mat-spinner>
      <mat-icon *ngIf="!dosyaYukleniyor">save</mat-icon>
      {{ dosyaYukleniyor ? 'Yükleniyor...' : 'Kaydet' }}
    </button>
  </div>

</div>
