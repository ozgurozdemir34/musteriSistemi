<div class="dialog-wrapper">
  <div class="dialog-header">
    <div class="dialog-header-left">
      <div class="logo-mark" style="background: linear-gradient(135deg, #10b981, #059669);">
        <mat-icon style="color: white; font-size: 20px; width: 20px; height: 20px; margin-top: 8px; margin-left: 8px;">mail</mat-icon>
      </div>
      <div>
        <h2 class="dialog-title">Mail Gönder</h2>
        <p class="dialog-sub">Alıcı: {{ data.adSoyad }}</p>
      </div>
    </div>
    <button mat-icon-button class="kapat-btn" (click)="dialogRef.close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-content">
    <form [formGroup]="form">
      
      <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 12px;" *ngIf="data.mailler?.length > 1">
        <mat-label>Gönderilecek Adres</mat-label>
        <mat-select formControlName="mail">
          <mat-option *ngFor="let m of data.mailler" [value]="m.email">{{ m.email }}</mat-option>
        </mat-select>
      </mat-form-field>

      <div *ngIf="data.mailler?.length === 1" style="padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; color: #475569;">
        <strong>Hedef Adres:</strong> {{ data.mailler[0].email }}
      </div>

      <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 12px;">
        <mat-label>Konu</mat-label>
        <input matInput formControlName="konu" placeholder="Mailin konusu">
        <mat-error *ngIf="form.get('konu')?.invalid">Konu girmek zorunludur.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Mesaj İçeriği</mat-label>
        <textarea matInput rows="6" formControlName="icerik" placeholder="Müşteriye iletilecek mesajınızı buraya yazın..."></textarea>
        <mat-error *ngIf="form.get('icerik')?.invalid">Mesaj içeriği boş bırakılamaz.</mat-error>
      </mat-form-field>

    </form>
  </mat-dialog-content>

  <div class="dialog-footer">
    <button mat-stroked-button class="iptal-btn" (click)="dialogRef.close()">İptal</button>
    <button mat-flat-button style="background-color: #10b981; color: white; border-radius: 8px; font-weight: 600;" 
            [disabled]="form.invalid" (click)="gonder()">
      <mat-icon>send</mat-icon> Gönder
    </button>
  </div>
</div>
